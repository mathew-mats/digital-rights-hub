<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Digital Rights Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#f8fafc; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
        .contact-card {
            background:white; border-radius:20px; border:1px solid #eef2f6; padding:40px;
            max-width:500px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,0.06);
        }
        .contact-card .icon {
            width:64px; height:64px; border-radius:50%; background:#dbeafe;
            display:flex; align-items:center; justify-content:center; margin:0 auto 16px;
            font-size:28px; color:#4a9eff;
        }
        .contact-card h1 { font-size:24px; font-weight:800; color:#1a2332; text-align:center; }
        .contact-card .subtitle { font-size:14px; color:#8a9bb5; text-align:center; margin-bottom:24px; }
        .contact-card .form-group { margin-bottom:16px; }
        .contact-card .form-group label { font-size:13px; font-weight:600; color:#1a2332; display:block; margin-bottom:4px; }
        .contact-card .form-group input,
        .contact-card .form-group textarea {
            width:100%; padding:12px 16px; border:2px solid #eef2f6; border-radius:12px;
            font-size:14px; font-family:'Inter',sans-serif; transition:all 0.3s;
        }
        .contact-card .form-group input:focus,
        .contact-card .form-group textarea:focus {
            border-color:#4a9eff; outline:none; box-shadow:0 0 0 4px rgba(74,158,255,0.08);
        }
        .contact-card .form-group textarea { resize:vertical; min-height:120px; }
        .btn-primary-custom {
            width:100%; background:linear-gradient(135deg,#4a9eff,#6c5ce7);
            color:white; padding:14px; border:none; border-radius:12px;
            font-weight:600; font-size:16px; cursor:pointer; transition:all 0.3s;
            box-shadow:0 4px 16px rgba(74,158,255,0.25);
        }
        .btn-primary-custom:hover { transform:translateY(-3px); box-shadow:0 8px 32px rgba(74,158,255,0.35); }
        .btn-back { display:block; text-align:center; margin-top:12px; color:#4a9eff; text-decoration:none; font-weight:600; }
        .btn-back:hover { text-decoration:underline; }
        .messages .alert { padding:12px 16px; border-radius:12px; font-size:14px; margin-bottom:12px; }
        .alert-success { background:#dcfce7; color:#166534; border:1px solid #86efac; }
        .alert-error { background:#fee2e2; color:#991b1b; border:1px solid #fca5a5; }
    </style>
</head>
<body>
    <div class="contact-card">
        <div class="icon"><i class="fas fa-envelope"></i></div>
        <h1>Contact Support</h1>
        <p class="subtitle">We'll get back to you as soon as possible</p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Describe your issue..." required></textarea>
            </div>
            <button type="submit" class="btn-primary-custom">
                <i class="fas fa-paper-plane" style="margin-right:8px;"></i> Send Message
            </button>
        </form>
        <a href="/" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Homepage</a>
    </div>
</body>
</html>
