<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | Digital Rights Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f2f5 0%, #e8edf5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            border: 1px solid #eef2f6;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .card .logo-icon .icon-wrap {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #4a9eff, #6c5ce7);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            box-shadow: 0 8px 24px rgba(74, 158, 255, 0.25);
        }
        .card .logo-icon h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #1a2332 60%, #4a9eff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card .icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #dbeafe;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            color: #4a9eff;
        }
        .card h2 {
            font-size: 24px;
            font-weight: 800;
            color: #1a2332;
            text-align: center;
            margin-bottom: 4px;
        }
        .card .subtitle {
            font-size: 14px;
            color: #8a9bb5;
            text-align: center;
            margin-bottom: 24px;
        }
        .card .form-group {
            margin-bottom: 16px;
        }
        .card .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #1a2332;
            display: block;
            margin-bottom: 6px;
        }
        .card .form-group label .required {
            color: #ef4444;
        }
        .card .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #eef2f6;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            background: #fafbfc;
        }
        .card .form-group input:focus {
            border-color: #4a9eff;
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(74, 158, 255, 0.08);
        }
        .card .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #4a9eff, #6c5ce7);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(74, 158, 255, 0.25);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .card .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(74, 158, 255, 0.35);
        }
        .messages {
            margin-bottom: 16px;
        }
        .messages .alert {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .messages .alert i { font-size: 16px; flex-shrink: 0; }
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        .alert-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        @media (max-width: 480px) {
            .card { padding: 32px 20px; }
            .card h2 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-icon">
            <div class="icon-wrap"><i class="fas fa-shield-alt"></i></div>
            <h1>Digital Rights Hub</h1>
        </div>

        <div class="icon">
            <i class="fas fa-key"></i>
        </div>

        <h2> Set New Password</h2>
        <p class="subtitle">Enter your new password below.</p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        <i class="fas fa-{% if message.tags == 'error' %}exclamation-circle{% else %}info-circle{% endif %}"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="new_password1">New Password <span class="required">*</span></label>
                <input type="password" id="new_password1" name="new_password1" placeholder="Enter your new password" required>
            </div>
            <div class="form-group">
                <label for="new_password2">Confirm Password <span class="required">*</span></label>
                <input type="password" id="new_password2" name="new_password2" placeholder="Confirm your password" required>
            </div>
            <button type="submit" class="btn-submit">
                <i class="fas fa-check-circle"></i> Reset Password
            </button>
        </form>
    </div>
</body>
</html>
