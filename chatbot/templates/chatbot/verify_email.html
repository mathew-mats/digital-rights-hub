<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | Digital Rights Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#f0f2f5; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .auth-card {
            background:white; border-radius:16px; border:1px solid #eef2f6; padding:40px;
            max-width:420px; width:100%; box-shadow:0 2px 8px rgba(0,0,0,0.02);
            margin:20px;
        }
        .auth-card h1 { font-size:28px; font-weight:700; color:#1a2332; margin-bottom:8px; text-align:center; letter-spacing:-0.5px; }
        .auth-card .subtitle { font-size:14px; color:#8a9bb5; text-align:center; margin-bottom:24px; }
        .auth-card .form-group { margin-bottom:16px; }
        .auth-card .form-group label { font-size:13px; font-weight:600; color:#1a2332; display:block; margin-bottom:4px; }
        .auth-card .form-group input {
            width:100%; padding:12px 16px; border:2px solid #eef2f6; border-radius:12px;
            font-size:24px; font-weight:700; text-align:center; letter-spacing:12px;
            font-family:'Inter',sans-serif; transition:all 0.3s;
        }
        .auth-card .form-group input:focus { border-color:#4a9eff; outline:none; box-shadow:0 0 0 4px rgba(74,158,255,0.08); }
        .btn-primary-custom {
            width:100%;
            background:linear-gradient(135deg,#4a9eff,#6c5ce7);
            color:white; padding:14px; border:none; border-radius:12px;
            font-size:16px; font-weight:600; cursor:pointer;
            transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
            box-shadow:0 4px 16px rgba(74,158,255,0.25);
        }
        .btn-primary-custom:hover { transform:translateY(-3px); box-shadow:0 8px 32px rgba(74,158,255,0.35); }
        .email-info {
            text-align:center; padding:12px; background:#f0f4ff; border-radius:12px; margin-bottom:20px;
            font-size:14px; color:#1a2332;
        }
        .email-info i { color:#4a9eff; margin-right:8px; }
        .links { text-align:center; margin-top:16px; font-size:14px; color:#8a9bb5; }
        .links a { color:#4a9eff; font-weight:600; text-decoration:none; }
        .links a:hover { text-decoration:underline; }
        .messages .alert { padding:12px 16px; border-radius:12px; font-size:14px; margin-bottom:12px; }
        .alert-error { background:#fee2e2; color:#991b1b; border:1px solid #fca5a5; }
        .alert-success { background:#dcfce7; color:#166534; border:1px solid #86efac; }
        .alert-info { background:#dbeafe; color:#1e40af; border:1px solid #93c5fd; }
        .code-hint { font-size:12px; color:#8a9bb5; text-align:center; margin-top:12px; }
        .resend-btn {
            background:none; border:none; color:#4a9eff; font-weight:600; cursor:pointer; text-decoration:underline;
        }
        .resend-btn:hover { color:#6c5ce7; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>🔐 Verify Your Email</h1>
        <div class="subtitle">Enter the 6-digit code sent to your email</div>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <div class="email-info">
            <i class="fas fa-envelope"></i> Code sent to <strong>{{ email }}</strong>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="code">Verification Code</label>
                <input type="text" id="code" name="code" placeholder="000000" maxlength="6" required autofocus>
            </div>
            <button type="submit" class="btn-primary-custom">
                <i class="fas fa-check-circle" style="margin-right:8px;"></i> Verify
            </button>
        </form>

        <div class="links">
            Didn't receive the code? 
            <button class="resend-btn" onclick="resendCode()">Resend</button>
        </div>
        <div class="code-hint">
            <i class="fas fa-clock"></i> Code expires in 10 minutes
        </div>
    </div>

    <script>
        // Auto-submit when 6 digits are entered
        document.getElementById('code').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
            if (this.value.length === 6) {
                this.form.submit();
            }
        });

        function resendCode() {
            window.location.href = "{% url 'verify_email' %}?resend=true";
        }
    </script>
</body>
</html>
