<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent | Digital Rights Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f2f5 0%, #e8edf5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            border: 1px solid #eef2f6;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .card .logo-icon .icon-wrap {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #4a9eff, #6c5ce7);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            box-shadow: 0 8px 24px rgba(74, 158, 255, 0.25);
        }
        .card .logo-icon h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #1a2332 60%, #4a9eff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card .icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #dbeafe;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 36px;
            color: #4a9eff;
        }
        .card h2 {
            font-size: 24px;
            font-weight: 800;
            color: #1a2332;
            margin-bottom: 8px;
        }
        .card p {
            font-size: 15px;
            color: #5a7a9a;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        .card .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 32px;
            background: linear-gradient(135deg, #4a9eff, #6c5ce7);
            color: white;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(74, 158, 255, 0.25);
        }
        .card .btn-back:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(74, 158, 255, 0.35);
        }
        .card .help-text {
            font-size: 13px;
            color: #8a9bb5;
            margin-top: 16px;
        }
        .card .help-text a {
            color: #4a9eff;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .card { padding: 32px 20px; }
            .card h2 { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-icon">
            <div class="icon-wrap"><i class="fas fa-shield-alt"></i></div>
            <h1>Digital Rights Hub</h1>
        </div>

        <div class="icon">
            <i class="fas fa-envelope"></i>
        </div>

        <h2> Check Your Email</h2>
        <p>We've sent you a password reset link. Please check your email and follow the instructions to reset your password.</p>

        <a href="{% url 'login' %}" class="btn-back">
            <i class="fas fa-arrow-left"></i> Back to Login
        </a>

        <div class="help-text">
            Didn't receive the email? <a href="{% url 'password_reset' %}">Resend</a>
        </div>
    </div>
</body>
</html>
